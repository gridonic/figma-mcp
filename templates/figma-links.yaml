# Figma MCP links
# Used by figma-mcp rules and scripts (tokens:sync, cache warm, modules:setup)
#
# Prefix a module URL with @ to mark it as a managed source node.
# Managed source nodes are warmed, inspected, and used for module generation.
# Links without @ are reference-only unless explicitly passed to a command.
# Leave a value empty ("") to skip that module.

# bridge.fileKey: required when using FIGMA_MCP_SOURCE=bridge with multiple Figma files open.
# Run your bridge command and check the output for the exact file name (case-sensitive).
bridge:
  fileKey: ""

styleguide:
  colors: ""
  typography: ""
  grid: ""

modules:
  # Add your modules here, one per line.
  # Prefix the Figma URL with @ to mark the module's source node.
  # Child nodes are discovered from the source node; do not add child node URLs manually.
  # Example:
  #   header-text: "@https://www.figma.com/design/<file-key>/...?node-id=XXX-YYY&m=dev"
  #   content-accordion: "@https://www.figma.com/design/<file-key>/...?node-id=XXX-YYY&m=dev"
  #   content-faq: ""
